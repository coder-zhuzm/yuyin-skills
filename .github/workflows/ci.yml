name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISABLE_TELEMETRY: '1'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    steps:
      - name: Check out the event revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the verified npm CLI
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Install maintenance dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Verify documentation and package contents
        run: npm run verify
