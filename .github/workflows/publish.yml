name: Publish npm package

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SOURCES.md'
      - 'VERIFICATION.md'
      - 'catalog.json'
      - 'upstream/**'
      - 'skills/**'
      - 'rules/**'
      - 'templates/**'
      - 'docs/**'
      - '!docs/history/**'
      - 'THIRD_PARTY_LICENSES/**'
      - 'scripts/**'
      - 'tests/**'
      - 'evals/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional new version; leave empty to release the next patch even without content changes. Pending candidates resume first.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'coder-zhuzm/yuyin-skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      DISABLE_TELEMETRY: '1'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install the verified npm CLI
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Install maintenance dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test release behavior
        run: npm test
      - name: Verify documentation and package contents
        run: npm run verify
      - name: Configure the release commit author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare or resume a release candidate
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release.mjs prepare
      - name: Publish with npm trusted publishing
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
        run: npm publish "$RELEASE_ARCHIVE" --access public --registry https://registry.npmjs.org/ --ignore-scripts
      - name: Verify the public package and create its GitHub Release
        if: steps.release.outputs.publish == 'true'
        run: node scripts/release.mjs finalize
      # A resumed candidate may precede newer commits already checked out on main.
      - name: Prepare changes that arrived after an interrupted release
        if: steps.release.outputs.resumed == 'true'
        id: catchup
        run: node scripts/release.mjs prepare --if-changed
      - name: Publish changes after the resumed candidate
        if: steps.catchup.outputs.publish == 'true'
        env:
          RELEASE_ARCHIVE: ${{ steps.catchup.outputs.archive }}
        run: npm publish "$RELEASE_ARCHIVE" --access public --registry https://registry.npmjs.org/ --ignore-scripts
      - name: Verify the subsequent package and GitHub Release
        if: steps.catchup.outputs.publish == 'true'
        run: node scripts/release.mjs finalize
